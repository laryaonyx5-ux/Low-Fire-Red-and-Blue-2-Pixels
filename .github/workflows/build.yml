name: Build resource pack

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "pack.mcmeta"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate resource pack files
        run: |
          test -f pack.mcmeta
          test -d assets/minecraft/models/block
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("pack.mcmeta").read_text(encoding="utf-8"))
          assert "pack" in metadata
          models = list(Path("assets/minecraft/models/block").glob("*.json"))
          assert models, "No block model JSON files found"
          for path in models:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(models)} model JSON files")
          PY

      - name: Build a clean resource-pack ZIP
        run: |
          mkdir -p dist
          rm -f "dist/Low-Fire-Red-and-Blue-2-Pixels-v1.1.0.zip"
          cd .
          zip -X -r "dist/Low-Fire-Red-and-Blue-2-Pixels-v1.1.0.zip" pack.mcmeta assets
          unzip -t "dist/Low-Fire-Red-and-Blue-2-Pixels-v1.1.0.zip"
          python3 - <<'PY'
          from zipfile import ZipFile
          path = "dist/Low-Fire-Red-and-Blue-2-Pixels-v1.1.0.zip"
          with ZipFile(path) as archive:
              names = archive.namelist()
              assert "pack.mcmeta" in names, "pack.mcmeta must be at ZIP root"
              assert any(n.startswith("assets/minecraft/models/block/") for n in names)
              assert archive.testzip() is None, "ZIP CRC validation failed"
              print(f"ZIP validated: {len(names)} entries")
          PY

      - name: Publish the ZIP as a direct GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-build-${{ github.run_number }}
          name: Low Fire Red and Blue 2 Pixels v1.1.0 (build ${{ github.run_number }})
          body: "Minecraft resource pack ZIP. Download the .zip asset directly; do not download the Actions artifact wrapper."
          files: dist/Low-Fire-Red-and-Blue-2-Pixels-v1.1.0.zip
          draft: false
          prerelease: true
          make_latest: false

      - name: Upload CI copy
        uses: actions/upload-artifact@v4
        with:
          name: Low-Fire-Red-and-Blue-2-Pixels-v1.1.0-CI
          path: dist/Low-Fire-Red-and-Blue-2-Pixels-v1.1.0.zip
          if-no-files-found: error
          retention-days: 30
